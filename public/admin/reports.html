<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penyewaan — Garage Rental Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-title">Garage Rental</div>
        <div class="sidebar-brand-role">Panel Admin</div>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/garages.html" class="nav-link">Manajemen Garasi</a>
        <a href="/admin/tenants.html" class="nav-link">Verifikasi Penyewa</a>
        <a href="/admin/extensions.html" class="nav-link">Perpanjangan Sewa</a>
        <a href="/admin/reports.html" class="nav-link active">Laporan</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" id="logoutBtn" class="nav-link nav-link-logout">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h1 class="topbar-title">Laporan Penyewaan Garasi</h1>
        <div class="topbar-meta">
          <span class="user-pill" id="currentUserDisplay">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div id="reportAlert" class="alert hidden" role="alert"></div>

        <div class="tabs">
          <button type="button" class="tab-btn active" data-report-tab="monthly">Per Bulan (Tahun Tertentu)</button>
          <button type="button" class="tab-btn" data-report-tab="daily">Per Hari (Bulan Tertentu)</button>
          <button type="button" class="tab-btn" data-report-tab="garageType">Per Tipe Garasi</button>
          <button type="button" class="tab-btn" data-report-tab="tenant">Per Penyewa</button>
        </div>

        <section class="card">
          <div class="card-body">
            <!-- Monthly Filter -->
            <div id="filterPanel-monthly" class="filter-bar">
              <div class="form-group">
                <label class="form-label" for="reportMonthlyYear">Tahun</label>
                <input type="number" id="reportMonthlyYear" class="form-control" min="2000" max="2100">
              </div>
              <button type="button" id="applyMonthlyFilterBtn" class="btn btn-primary">Tampilkan Laporan</button>
            </div>

            <!-- Daily Filter -->
            <div id="filterPanel-daily" class="filter-bar hidden">
              <div class="form-group">
                <label class="form-label" for="reportDailyYear">Tahun</label>
                <input type="number" id="reportDailyYear" class="form-control" min="2000" max="2100">
              </div>
              <div class="form-group">
                <label class="form-label" for="reportDailyMonth">Bulan</label>
                <select id="reportDailyMonth" class="form-select">
                  <option value="1">Januari</option>
                  <option value="2">Februari</option>
                  <option value="3">Maret</option>
                  <option value="4">April</option>
                  <option value="5">Mei</option>
                  <option value="6">Juni</option>
                  <option value="7">Juli</option>
                  <option value="8">Agustus</option>
                  <option value="9">September</option>
                  <option value="10">Oktober</option>
                  <option value="11">November</option>
                  <option value="12">Desember</option>
                </select>
              </div>
              <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-bottom:8px;">
                <input type="checkbox" id="reportDailyIncludeEmpty">
                <label for="reportDailyIncludeEmpty" style="font-size:13px;cursor:pointer;">Tampilkan tanggal tanpa transaksi</label>
              </div>
              <button type="button" id="applyDailyFilterBtn" class="btn btn-primary">Tampilkan Laporan</button>
            </div>

            <!-- Garage Type Filter -->
            <div id="filterPanel-garageType" class="filter-bar hidden">
              <div class="form-group">
                <label class="form-label" for="reportGarageTypeSelect">Tipe Garasi</label>
                <select id="reportGarageTypeSelect" class="form-select">
                  <option value="">Semua Tipe Garasi</option>
                  <option value="BIKE">Garasi Sepeda</option>
                  <option value="CAR">Garasi Mobil</option>
                  <option value="EV">Garasi Mobil Listrik</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="reportGarageTypeYear">Filter Tahun (Opsional)</label>
                <input type="number" id="reportGarageTypeYear" class="form-control" min="2000" max="2100" placeholder="Semua Tahun">
              </div>
              <button type="button" id="applyGarageTypeFilterBtn" class="btn btn-primary">Tampilkan Laporan</button>
            </div>

            <!-- Tenant Filter -->
            <div id="filterPanel-tenant" class="filter-bar hidden">
              <div class="form-group" style="min-width:280px;">
                <label class="form-label" for="reportTenantSearch">Cari Penyewa (Nama / NIK / Email)</label>
                <input type="text" id="reportTenantSearch" class="form-control" placeholder="Kosongkan untuk semua penyewa">
              </div>
              <button type="button" id="applyTenantFilterBtn" class="btn btn-primary">Tampilkan Laporan</button>
            </div>
          </div>
        </section>

        <section id="reportSummaryCards" class="stats-grid stats-grid-5"></section>

        <section class="card">
          <div class="card-body">
            <div class="table-wrapper">
              <table class="table">
                <thead id="reportTableHead"></thead>
                <tbody id="reportTableBody">
                  <tr><td colspan="8" class="empty-state">Memuat laporan...</td></tr>
                </tbody>
                <tfoot id="reportTableFoot"></tfoot>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
