<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Penyewa — Garage Rental Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-wide">
    <div class="auth-brand">
      <div class="auth-brand-badge">Registrasi Penyewa</div>
      <h1>Pendaftaran Akun Penyewa</h1>
      <p>Lengkapi identitas sesuai KTP. Akun akan diverifikasi oleh Admin sebelum dapat menyewa garasi.</p>
    </div>

    <div id="registerAlert" class="alert hidden" role="alert"></div>

    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="nik">NIK (16 Digit Nomor KTP)</label>
          <input
            type="text"
            id="nik"
            name="nik"
            class="form-control"
            placeholder="3578012345670001"
            maxlength="16"
            pattern="\d{16}"
            required
          >
          <span class="form-hint">Harus 16 digit angka sesuai KTP.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Nomor Telepon</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-control"
            placeholder="081234567890"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="fullName">Nama Lengkap</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          class="form-control"
          placeholder="Nama lengkap sesuai KTP"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email (digunakan sebagai Username)</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="penyewa@email.com"
          required
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Minimal 6 karakter"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Konfirmasi Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="Ulangi password"
            minlength="6"
            required
          >
        </div>
      </div>

      <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
        Daftar Sebagai Penyewa
      </button>
    </form>

    <div class="auth-footer">
      Sudah memiliki akun? <a href="/index.html"><strong>Kembali ke Halaman Login</strong></a>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
