<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Garage Rental Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-badge">Garage Rental System</div>
      <h1>Masuk ke Aplikasi</h1>
      <p>Silakan login menggunakan akun Admin atau Penyewa Anda.</p>
    </div>

    <div id="authAlert" class="alert hidden" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email (Username)</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="contoh@email.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Masukkan password Anda"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
        Masuk ke Sistem
      </button>
    </form>

    <div class="auth-footer">
      Belum memiliki akun penyewa?
      <a href="/tenant/register.html"><strong>Daftar sebagai Penyewa</strong></a>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
